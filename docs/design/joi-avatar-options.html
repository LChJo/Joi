<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Joi 素描头像 · A / B / C</title><style>*{box-sizing:border-box}body{margin:0;background:#f1f3f0;color:#1c2924;font-family:"Microsoft YaHei UI","PingFang SC",system-ui,sans-serif}.page{max-width:1120px;margin:0 auto;padding:28px 30px 24px}.intro{margin-bottom:22px}.intro h1{margin:0 0 8px;font-size:28px;line-height:1.3;font-weight:600}.intro p{margin:0;color:#68756e;font-size:14px;line-height:1.6}.options{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}article{min-width:0;padding:18px;background:#fcfdfc;border:1px solid #dee4de;border-radius:16px}article header{margin-bottom:14px}h2{margin:0 0 5px;font-size:19px;font-weight:600}article header p{margin:0;color:#68756e;font-size:13px}.portrait{display:block;width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px}.detail{margin:13px 0;color:#68756e;font-size:12px;line-height:1.5}.samples{display:flex;align-items:flex-end;justify-content:space-between;gap:8px;padding-top:15px;border-top:1px solid #dee4de}.samples>div{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:10px}.samples img{display:block;object-fit:cover;border:1px solid #dee4de}.avatar{width:44px;height:44px;border-radius:50%}.app{width:64px;height:64px;border-radius:14px}.app.small{width:32px;height:32px;border-radius:7px}.samples span{font-size:11px;color:#68756e;white-space:nowrap}.note{margin:18px 0 0;font-size:12px;line-height:1.6;color:#68756e}@media(max-width:780px){.page{padding:24px 16px}.options{grid-template-columns:1fr}article{max-width:420px;width:100%;margin:auto}}</style></head><body><main class="page"><header class="intro"><h1>Joi 的三种素描表达</h1><p>对比大图、圆形头像和应用图标，选定后统一替换。</p></header><section class="options" aria-label="三个候选方案"><article><header><h2>A · 铜版蚀刻</h2><p>清晰黑白 · 细密排线</p></header><img class="portrait" src="joi-avatar-option-a.png" alt="A · 铜版蚀刻头像方案"><p class="detail">更接近 Hermes 的雕刻肖像语言。</p><div class="samples"><div><img class="avatar" src="joi-avatar-option-a.png" alt="44px 圆形头像"><span>头像 · 44px</span></div><div><img class="app small" src="joi-avatar-option-a.png" alt="32px 应用图标"><span>图标 · 32px</span></div><div><img class="app" src="joi-avatar-option-a.png" alt="64px 应用图标"><span>图标 · 64px</span></div></div></article><article><header><h2>B · 铅笔素描</h2><p>柔和笔触 · 纸张质感</p></header><img class="portrait" src="joi-avatar-option-b.png" alt="B · 铅笔素描头像方案"><p class="detail">更亲切，保留手绘肖像的温度。</p><div class="samples"><div><img class="avatar" src="joi-avatar-option-b.png" alt="44px 圆形头像"><span>头像 · 44px</span></div><div><img class="app small" src="joi-avatar-option-b.png" alt="32px 应用图标"><span>图标 · 32px</span></div><div><img class="app" src="joi-avatar-option-b.png" alt="64px 应用图标"><span>图标 · 64px</span></div></div></article><article><header><h2>C · 深绿版画</h2><p>森林绿底 · 浅色刻线</p></header><img class="portrait" src="joi-avatar-option-c.png" alt="C · 深绿版画头像方案"><p class="detail">与现有品牌协调，小图标对比更强。</p><div class="samples"><div><img class="avatar" src="joi-avatar-option-c.png" alt="44px 圆形头像"><span>头像 · 44px</span></div><div><img class="app small" src="joi-avatar-option-c.png" alt="32px 应用图标"><span>图标 · 32px</span></div><div><img class="app" src="joi-avatar-option-c.png" alt="64px 应用图标"><span>图标 · 64px</span></div></div></article></section><p class="note">已选定 C · 深绿版画，并应用到侧栏头像与应用图标。原图与生成提示词已保存。</p></main></body></html>
