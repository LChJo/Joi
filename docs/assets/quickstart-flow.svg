<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 740" font-family="'Segoe UI', system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arr2" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#57606a"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1160" height="740" fill="#ffffff"/>

  <text x="30" y="34" font-size="20" font-weight="bold" fill="#24292f">joi 快速开始流程</text>
  <text x="30" y="54" font-size="11.5" fill="#57606a">命令取自 package.json#scripts（.npmrc：engine-strict=true）；启动序列对应 src/main/index.ts 与 src/main/composition 的真实执行顺序</text>

  <!-- 列标题 -->
  <rect x="30" y="76" width="250" height="30" rx="15" fill="#ddf4ff" stroke="#0969da"/>
  <text x="155" y="96" font-size="13" font-weight="bold" fill="#0969da" text-anchor="middle">① 准备环境与依赖</text>
  <rect x="313" y="76" width="250" height="30" rx="15" fill="#ddf4ff" stroke="#0969da"/>
  <text x="438" y="96" font-size="13" font-weight="bold" fill="#0969da" text-anchor="middle">② 启动应用</text>
  <rect x="596" y="76" width="250" height="30" rx="15" fill="#ddf4ff" stroke="#0969da"/>
  <text x="721" y="96" font-size="13" font-weight="bold" fill="#0969da" text-anchor="middle">③ 首次设置</text>
  <rect x="879" y="76" width="250" height="30" rx="15" fill="#ddf4ff" stroke="#0969da"/>
  <text x="1004" y="96" font-size="13" font-weight="bold" fill="#0969da" text-anchor="middle">④ 日常使用 · 核心数据流</text>

  <!-- 列 1：准备 -->
  <rect x="30" y="122" width="250" height="66" rx="8" fill="#ffffff" stroke="#d0d7de"/>
  <text x="44" y="144" font-size="12.5" font-weight="bold" fill="#24292f">系统要求</text>
  <text x="44" y="162" font-size="10.5" fill="#24292f">Node.js ≥ 22.19.0 · npm ≥ 11.0.0</text>
  <text x="44" y="177" font-size="10.5" fill="#57606a">package.json engines · engine-strict</text>

  <rect x="30" y="212" width="250" height="56" rx="8" fill="#ffffff" stroke="#d0d7de"/>
  <text x="44" y="234" font-size="12.5" font-weight="bold" fill="#24292f">获取仓库 · 安装依赖</text>
  <text x="44" y="252" font-size="10.5" fill="#24292f">git clone 本仓库 → npm ci</text>

  <rect x="30" y="292" width="250" height="66" rx="8" fill="#ffffff" stroke="#d0d7de"/>
  <text x="44" y="314" font-size="12.5" font-weight="bold" fill="#24292f">门禁自检（可选）</text>
  <text x="44" y="332" font-size="10.5" fill="#24292f">npm run typecheck · lint · test</text>
  <text x="44" y="347" font-size="10.5" fill="#57606a">固定质量门禁（package.json#scripts）</text>

  <line x1="155" y1="188" x2="155" y2="212" stroke="#57606a" stroke-width="1.5" marker-end="url(#arr2)"/>
  <line x1="155" y1="268" x2="155" y2="292" stroke="#57606a" stroke-width="1.5" marker-end="url(#arr2)"/>

  <!-- 列 2：启动 -->
  <rect x="313" y="122" width="250" height="78" rx="8" fill="#ffffff" stroke="#d0d7de"/>
  <text x="327" y="144" font-size="12.5" font-weight="bold" fill="#24292f">npm run dev（或 npm run app:run）</text>
  <text x="327" y="162" font-size="10.5" fill="#24292f">dev：Vite 127.0.0.1:43715 · npm start 等价</text>
  <text x="327" y="177" font-size="10.5" fill="#24292f">app:run：build:prod 后 electron .</text>

  <line x1="438" y1="200" x2="438" y2="224" stroke="#57606a" stroke-width="1.5" marker-end="url(#arr2)"/>

  <rect x="313" y="224" width="250" height="450" rx="10" fill="#f6f8fa" stroke="#1a7f37"/>
  <text x="325" y="248" font-size="12.5" font-weight="bold" fill="#1a7f37">真实启动序列</text>
  <text x="325" y="264" font-size="10" fill="#57606a">src/main/index.ts → composition/runtime-host.ts</text>

  <rect x="325" y="278" width="226" height="52" rx="6" fill="#ffffff" stroke="#d0d7de"/>
  <text x="337" y="298" font-size="11.5" font-weight="bold" fill="#24292f">① 获取单实例锁</text>
  <text x="337" y="315" font-size="10" fill="#57606a">requestSingleInstanceLock</text>
  <line x1="438" y1="330" x2="438" y2="342" stroke="#57606a" stroke-width="1.5" marker-end="url(#arr2)"/>

  <rect x="325" y="342" width="226" height="52" rx="6" fill="#ffffff" stroke="#d0d7de"/>
  <text x="337" y="362" font-size="11.5" font-weight="bold" fill="#24292f">② 启动 Runtime Worker 线程</text>
  <text x="337" y="379" font-size="10" fill="#57606a">startDesktopRuntime → new Worker</text>
  <line x1="438" y1="394" x2="438" y2="406" stroke="#57606a" stroke-width="1.5" marker-end="url(#arr2)"/>

  <rect x="325" y="406" width="226" height="52" rx="6" fill="#ffffff" stroke="#d0d7de"/>
  <text x="337" y="426" font-size="11.5" font-weight="bold" fill="#24292f">③ 打开 SQLite 并执行迁移</text>
  <text x="337" y="443" font-size="10" fill="#57606a">openRuntimeDatabase · 迁移 ×75</text>
  <line x1="438" y1="458" x2="438" y2="470" stroke="#57606a" stroke-width="1.5" marker-end="url(#arr2)"/>

  <rect x="325" y="470" width="226" height="52" rx="6" fill="#ffffff" stroke="#d0d7de"/>
  <text x="337" y="490" font-size="11.5" font-weight="bold" fill="#24292f">④ HTTP 监听 127.0.0.1:43130</text>
  <text x="337" y="507" font-size="10" fill="#57606a">/api/v1 + SSE · routes/ 13 路由族</text>
  <line x1="438" y1="522" x2="438" y2="534" stroke="#57606a" stroke-width="1.5" marker-end="url(#arr2)"/>

  <rect x="325" y="534" width="226" height="52" rx="6" fill="#ffffff" stroke="#d0d7de"/>
  <text x="337" y="554" font-size="11.5" font-weight="bold" fill="#24292f">⑤ ActorTree 单根 tick 开始</text>
  <text x="337" y="571" font-size="10" fill="#57606a">JoiActor 根 → WorkbenchActor 子树</text>
  <line x1="438" y1="586" x2="438" y2="598" stroke="#57606a" stroke-width="1.5" marker-end="url(#arr2)"/>

  <rect x="325" y="598" width="226" height="52" rx="6" fill="#ffffff" stroke="#d0d7de"/>
  <text x="337" y="618" font-size="11.5" font-weight="bold" fill="#24292f">⑥ 创建主窗口与托盘</text>
  <text x="337" y="635" font-size="10" fill="#57606a">Vite（开发）· apiOrigin（生产）</text>

  <!-- 列 3：首次设置 -->
  <rect x="596" y="122" width="250" height="72" rx="8" fill="#ffffff" stroke="#d0d7de"/>
  <text x="610" y="144" font-size="12.5" font-weight="bold" fill="#24292f">① 创建管理员密码</text>
  <text x="610" y="162" font-size="10.5" fill="#24292f">≥ 6 位（ADMIN_PASSWORD_MIN_LENGTH）</text>
  <text x="610" y="177" font-size="10.5" fill="#57606a">SetupJourney（Onboarding.tsx）</text>

  <rect x="596" y="222" width="250" height="88" rx="8" fill="#ffffff" stroke="#d0d7de"/>
  <text x="610" y="244" font-size="12.5" font-weight="bold" fill="#24292f">② 连接模型来源（model source）</text>
  <text x="610" y="262" font-size="10.5" fill="#24292f">Kimi · GLM · Qwen · Doubao · MiniMax</text>
  <text x="610" y="277" font-size="10.5" fill="#24292f">DeepSeek · OpenAI 兼容（openai / anthropic）</text>
  <text x="610" y="292" font-size="10.5" fill="#57606a">凭据经 Electron safeStorage 加密</text>

  <rect x="596" y="338" width="250" height="64" rx="8" fill="#ffffff" stroke="#d0d7de"/>
  <text x="610" y="360" font-size="12.5" font-weight="bold" fill="#24292f">③ 进入 joi 主界面</text>
  <text x="610" y="378" font-size="10.5" fill="#24292f">管理员登录 api.login · 首页 JoiHome.tsx</text>

  <line x1="721" y1="194" x2="721" y2="222" stroke="#57606a" stroke-width="1.5" marker-end="url(#arr2)"/>
  <line x1="721" y1="310" x2="721" y2="338" stroke="#57606a" stroke-width="1.5" marker-end="url(#arr2)"/>

  <!-- 列 4：日常使用 -->
  <rect x="879" y="122" width="250" height="72" rx="8" fill="#ffffff" stroke="#d0d7de"/>
  <text x="893" y="144" font-size="12.5" font-weight="bold" fill="#24292f">输入成为持久事件</text>
  <text x="893" y="162" font-size="10.5" fill="#24292f">首页输入 / 定时 / 搭档结果 → 持久收件箱</text>
  <text x="893" y="177" font-size="10.5" fill="#57606a">durable 事件（SQLite）</text>

  <rect x="879" y="218" width="250" height="72" rx="8" fill="#ffffff" stroke="#d0d7de"/>
  <text x="893" y="240" font-size="12.5" font-weight="bold" fill="#24292f">Pi 规划与路由</text>
  <text x="893" y="258" font-size="10.5" fill="#24292f">Pi SDK 0.87.1 → 工作台上下文投影</text>
  <text x="893" y="273" font-size="10.5" fill="#57606a">workbench（工作台）上下文</text>

  <rect x="879" y="314" width="250" height="72" rx="8" fill="#ffffff" stroke="#d0d7de"/>
  <text x="893" y="336" font-size="12.5" font-weight="bold" fill="#24292f">工作 DAG → 策略门控 → outbox</text>
  <text x="893" y="354" font-size="10.5" fill="#24292f">通过策略后派发给搭档执行</text>
  <text x="893" y="369" font-size="10.5" fill="#57606a">policy gate → outbox 派发</text>

  <rect x="879" y="410" width="250" height="72" rx="8" fill="#ffffff" stroke="#d0d7de"/>
  <text x="893" y="432" font-size="12.5" font-weight="bold" fill="#24292f">本机 Pi 搭档 / A2A 搭档执行</text>
  <text x="893" y="450" font-size="10.5" fill="#24292f">结果 · 失败 · 工件回写为工作台事件</text>
  <text x="893" y="465" font-size="10.5" fill="#57606a">本机子进程或局域网 A2A 协议</text>

  <rect x="879" y="506" width="250" height="60" rx="8" fill="#ffffff" stroke="#d0d7de"/>
  <text x="893" y="528" font-size="12.5" font-weight="bold" fill="#24292f">事件经 SSE 实时推送界面</text>
  <text x="893" y="546" font-size="10.5" fill="#24292f">/api/v1 + SSE（runtime-listeners）</text>

  <line x1="1004" y1="194" x2="1004" y2="218" stroke="#57606a" stroke-width="1.5" marker-end="url(#arr2)"/>
  <line x1="1004" y1="290" x2="1004" y2="314" stroke="#57606a" stroke-width="1.5" marker-end="url(#arr2)"/>
  <line x1="1004" y1="386" x2="1004" y2="410" stroke="#57606a" stroke-width="1.5" marker-end="url(#arr2)"/>
  <line x1="1004" y1="482" x2="1004" y2="506" stroke="#57606a" stroke-width="1.5" marker-end="url(#arr2)"/>

  <!-- 跨列箭头 -->
  <path d="M280,325 L296,325 L296,161 L313,161" fill="none" stroke="#57606a" stroke-width="1.5" marker-end="url(#arr2)"/>
  <path d="M563,449 L580,449 L580,158 L596,158" fill="none" stroke="#57606a" stroke-width="1.5" marker-end="url(#arr2)"/>
  <text x="568" y="441" font-size="10" fill="#57606a">启动完成</text>
  <path d="M846,370 L862,370 L862,158 L879,158" fill="none" stroke="#57606a" stroke-width="1.5" marker-end="url(#arr2)"/>

  <text x="30" y="712" font-size="10.5" fill="#57606a">核心数据流摘要对应 docs/03-system-architecture.md §0；命令、端口与门禁对应 package.json#scripts、vite.config.ts 与 src/main/composition/runtime-host.ts</text>
</svg>
