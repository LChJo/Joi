name: Rebuild Joi 0.1.10 installers

on:
  push:
    branches: [rebuild/joi-0.1.10]

permissions:
  contents: read

env:
  SOURCE_COMMIT: 'e6ac7cde2c0116110b62b09b02d6166938c1a0a0'
  RELEASE_VERSION: '0.1.10'

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            command: package:win
            artifact: joi-0.1.10-windows
            installer: 'release-joi/*.exe'
          - os: macos-latest
            command: package:mac
            artifact: joi-0.1.10-macos
            installer: 'release-joi/*.dmg'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_COMMIT }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native/joi-remote -> target
          cache-on-failure: 'true'
      - name: Verify source and package version
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          node -e 'const p=require("./package.json"), l=require("./package-lock.json"); if ([p.version,l.version,l.packages[""].version].some(v => v !== process.env.RELEASE_VERSION)) process.exit(1)'
      - run: npm ci
      - name: Build native installer
        run: npm run ${{ matrix.command }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.installer }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  bundle:
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: joi-0.1.10-*
          merge-multiple: true
          path: installers
      - name: Verify and checksum both installers
        working-directory: installers
        shell: bash
        run: |
          shopt -s nullglob
          windows=(joi-0.1.10-*.exe)
          macos=(joi-0.1.10-*.dmg)
          test "${#windows[@]}" -eq 1
          test "${#macos[@]}" -eq 1
          sha256sum "${windows[0]}" "${macos[0]}" > SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt
          printf '%s\n' "$SOURCE_COMMIT" > SOURCE_COMMIT.txt
          {
            printf 'Source commit: `%s`\n\n' "$SOURCE_COMMIT"
            printf '```text\n'
            cat SHA256SUMS.txt
            printf '```\n'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: joi-0.1.10-installers
          path: installers/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
