name: quality

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            package: package:win
            artifact: joi-windows
            installer: release-joi/*.exe
          - os: macos-latest
            package: package:mac
            artifact: joi-macos
            installer: release-joi/*.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Cache native build dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: native/joi-remote -> target
          cache-on-failure: "true"
      - run: npm ci
      - run: npm run i18n:check
      - run: npm run typecheck
      - run: npm run lint
      - name: Build production desktop
        run: node scripts/ci-build.mjs
      - name: Unit, integration, and renderer tests with coverage
        run: npm run test:coverage
      - name: Electron E2E
        run: npx playwright test
      - name: Build native installer
        if: github.ref != 'refs/heads/test' && github.head_ref != 'test'
        run: npm run ${{ matrix.package }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Upload installer
        if: github.ref != 'refs/heads/test' && github.head_ref != 'test'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.installer }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  release:
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: desktop-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v8
        with:
          name: joi-windows
          path: release-assets
      - uses: actions/download-artifact@v8
        with:
          name: joi-macos
          path: release-assets
      - name: Publish versioned desktop release
        run: node scripts/publish-desktop-release.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
