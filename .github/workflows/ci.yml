name: quality

on:
  push:
  pull_request:

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run i18n:check
      - run: npm run typecheck
      - run: npm run lint
      - name: Build production desktop
        run: node scripts/ci-build.mjs
      - name: Unit, integration, and renderer tests with coverage
        run: npm run test:coverage
      - name: Electron E2E
        run: npx playwright test
      - run: npm run package:verify
      - run: npm run package:dir
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
