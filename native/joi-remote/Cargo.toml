[package]
name = "joi-remote"
version = "0.1.0"
edition = "2024"
license = "UNLICENSED"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "joi-remote-sidecar"
path = "src/bin/sidecar.rs"

[dependencies]
anyhow = "1.0.100"
base64 = "0.22.1"
hmac = "0.12.1"
# Keep the usual transport features, but use the hybrid-capable TLS backend.
# The deployed relay path resets the small classical-only ClientHello.
iroh = { version = "=1.0.2", default-features = false, features = ["metrics", "fast-apple-datapath", "portmapper", "tls-aws-lc-rs"] }
rustls = { version = "0.23.43", default-features = false, features = ["aws-lc-rs", "std", "prefer-post-quantum"] }
rand = "0.9.2"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
sha2 = "0.10.9"
thiserror = "2.0.16"
tokio = { version = "1.47.1", features = ["macros", "rt-multi-thread", "sync", "time"] }
uuid = { version = "1.18.1", features = ["v4"] }

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21.1"

[dev-dependencies]
pretty_assertions = "1.4.1"
