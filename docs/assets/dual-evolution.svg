  <line x1="430" y1="543" x2="458" y2="543" stroke="#57606a" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="466" y="547" font-size="11" fill="#57606a">回路内步骤</text>
  <line x1="560" y1="543" x2="588" y2="543" stroke="#8250df" stroke-width="1.8" marker-end="url(#arrp)"/>
  <text x="596" y="547" font-size="11" fill="#57606a">跨回路反馈</text>
</svg>
